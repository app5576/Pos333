plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.posmix.mixtuvgag'
    compileSdk 34

    defaultConfig {
        applicationId "com.posmix.mixtuvgag"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // تعطيل NDK لتجنب مشاكل llvm-strip
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
        dataBinding true
    }
    
    // تعطيل مهمة stripDebugDebugSymbols لتجنب مشكلة llvm-strip
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    
    // تعطيل ضغط ملفات JNI
    androidResources {
        noCompress 'so'
    }
}

// تعطيل مهمة stripDebugDebugSymbols
tasks.whenTaskAdded { task ->
    if (task.name.contains("stripDebugDebugSymbols") || 
        task.name.contains("stripReleaseDebugSymbols")) {
        task.enabled = false
    }
}

dependencies {
    // دعم Java 8+ للأجهزة القديمة
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Lifecycle & ViewModel
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    
    // Room components
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"
    
    // UI & Preferences
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.7.2')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-firestore'
    
    // CameraX
    implementation "androidx.camera:camera-core:1.3.1"
    implementation "androidx.camera:camera-camera2:1.3.1"
    implementation "androidx.camera:camera-lifecycle:1.3.1"
    implementation "androidx.camera:camera-view:1.3.1"

    testImplementation 'junit:junit:4.13.2'
    implementation 'net.sourceforge.jexcelapi:jxl:2.6.12'
}